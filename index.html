<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Shopper</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF4400">
    
    <!-- OneSignal SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ecd72043-8857-49fa-8faf-522848a63e35",
          slidedown: {
            enabled: true,
            autoPrompt: true,
          }
        });
      });
    </script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: #FF4400; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        .btn:disabled { background: #ccc; }
        #status { margin-top: 15px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Portal Shopper</h2>
        <p>Mantente al día con las últimas novedades y gestiones.</p>
        
        <!-- Botón de tu PWA y lógica de la app -->
        <button id="btnPWA" class="btn" style="display:none;">Instalar App</button>
        <div id="status">Cargando aplicación...</div>
    </div>

    <script>
        // Registrar Service Worker de la PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => {
                console.log('SW de PWA registrado con éxito', reg);
                document.getElementById('status').innerText = 'Portal listo para su uso.';
            })
            .catch(err => {
                console.error('Error al registrar SW:', err);
                document.getElementById('status').innerText = 'Error al cargar el Service Worker.';
            });
        }

        // Evento para botón de instalación de la PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnPWA');
            btn.style.display = 'block';
            btn.addEventListener('click', () => {
                btn.style.display = 'none';
                deferredPrompt.prompt();
            });
        });
    </script>
</body>
</html>
