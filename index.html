<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portal Shopper Pro</title>

  <!-- ARCHIVOS DE CONFIGURACIÓN PWA PARA INSTALACIÓN EN MÓVIL -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001f3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soy Shopper">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #001f3f;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- REEMPLAZA ESTE LINK CON LA URL DE TU WEBAPP DESPLEGADA DE APPS SCRIPT -->
  <iframe src="https://script.google.com/macros/s/AKfycbwjkr1xUt0tKydNE6Gsj0fd9JEy_uxl52YkiwtjKxtwC54MOLptgkjVX6WzeDkJtv4a/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    // Registrar el Service Worker de la PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('PWA Lista en GitHub Pages', reg); })
          .catch(function(err) { console.log('Error PWA:', err); });
      });
    }
  </script>
</body>
</html>
