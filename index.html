<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portal Shopper Pro</title>

  <!-- ARCHIVOS DE CONFIGURACIÓN PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001f3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soy Shopper">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Estilos Modal & Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ========================================== -->
  <!--      SDK Y CONFIGURACIÓN DE ONESIGNAL      -->
  <!-- ========================================== -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ecd72043-8857-49fa-8faf-522848a63e35",
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
        notifyButton: {
          enable: true, /* Muestra la campana flotante nativa en la esquina */
          size: 'medium',
          theme: 'default',
          position: 'bottom-right'
        },
        slidedown: {
          enabled: true,
          autoPrompt: true
        }
      });

      // Actualizar el estado del botón personalizado según el permiso actual
      OneSignal.Notifications.addEventListener("permissionChange", function(permission) {
        actualizarEstadoNotificaciones(permission);
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #001f3f;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    /* El iframe deja espacio abajo si se muestra la barra inferior */
    .app-frame {
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 50px;
    }

    /* BARRA INFERIOR CON CAMPANA DE NOTIFICACIONES */
    .notification-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background-color: #00152b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 9999;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn-bell-push {
      background: #F54927;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 73, 39, 0.4);
    }

    .btn-bell-push.subscribed {
      background: #198754;
      box-shadow: 0 4px 12px rgba(25, 135, 84, 0.4);
    }
    
    /* MODAL DE INSTALACIÓN SUGERIDA/FORZADA */
    .pwa-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 31, 63, 0.92);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: white;
      text-align: center;
    }
    .pwa-card {
      background: #ffffff;
      color: #001f3f;
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .btn-instalar {
      background: #F54927;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      padding: 14px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(245, 73, 39, 0.3);
    }
  </style>
</head>
<body>

  <!-- TU WEBAPP DE GOOGLE APPS SCRIPT DENTRO DEL IFRAME -->
  <iframe 
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbwjkr1xUt0tKydNE6Gsj0fd9JEy_uxl52YkiwtjKxtwC54MOLptgkjVX6WzeDkJtv4a/exec" 
    allow="camera; microphone; geolocation; autoplay; fullscreen"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation">
  </iframe>

  <!-- BARRA INFERIOR PERMANENTE PARA NOTIFICACIONES -->
  <div class="notification-bar">
    <span class="text-white small fw-bold">
      <i class="fa-solid fa-shield-halved text-warning me-1"></i> Portal Shopper Pro
    </span>
    <button id="btnPedirNotificaciones" class="btn-bell-push" onclick="solicitarPermisoNotificacion()">
      <i class="fa-solid fa-bell fa-bounce"></i> <span id="lblBtnNotif">Activar Push</span>
    </button>
  </div>

  <!-- POP-UP PARA CAPTURAR LA INSTALACIÓN EN MÓVILES -->
  <div id="pwaModal" class="pwa-overlay">
    <div class="pwa-card">
      <img src="icon-192.png" width="75" height="75" class="rounded-4 mb-3 shadow-sm" alt="Logo">
      <h5 class="fw-bold mb-2">Instala la App Oficial</h5>
      <p class="text-muted small mb-4">Instala <b>Portal Shopper</b> en tu pantalla de inicio para un acceso rápido y directo.</p>
      
      <!-- Botón Android / Chrome -->
      <button id="btnInstallPWA" class="btn-instalar mb-2" onclick="instalarPWA()">
        <i class="fa-solid fa-download me-2"></i> INSTALAR AHORA
      </button>

      <!-- Instrucción si el usuario usa iPhone / Safari -->
      <div id="iosInstruction" class="d-none alert alert-light border mt-2 small text-start">
        <i class="fa-solid fa-arrow-up-from-bracket text-primary"></i> Toca <b>Compartir</b> en Safari y selecciona <b>"Agregar a inicio"</b>.
      </div>

      <button class="btn btn-link text-muted btn-sm text-decoration-none mt-2" onclick="cerrarModalPWA()">Continuar en navegador</button>
    </div>
  </div>

  <script>
    // LÓGICA DE SUSCRIPCIÓN CON BOTÓN / CAMPANA
    function solicitarPermisoNotificacion() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        if (!OneSignal.Notifications.permission) {
          await OneSignal.Notifications.requestPermission();
        } else if (OneSignal.Notifications.permission === "granted") {
          // Si ya tiene permiso pero está desuscrito, lo suscribe explícitamente
          await OneSignal.User.PushSubscription.optIn();
          alert("¡Notificaciones activas correctamente!");
        } else {
          alert("Las notificaciones están bloqueadas en tu navegador. Debes hacer clic en el candado de la barra de direcciones y elegir 'Permitir'.");
        }
      });
    }

    function actualizarEstadoNotificaciones(concedido) {
      const btn = document.getElementById('btnPedirNotificaciones');
      const lbl = document.getElementById('lblBtnNotif');
      
      if (concedido || Notification.permission === 'granted') {
        btn.classList.add('subscribed');
        lbl.textContent = 'Push Activas';
        btn.querySelector('i').className = 'fa-solid fa-bell-slash';
      } else {
        btn.classList.remove('subscribed');
        lbl.textContent = 'Activar Push';
        btn.querySelector('i').className = 'fa-solid fa-bell fa-bounce';
      }
    }

    // Revisar estado al cargar
    window.addEventListener('load', () => {
      if ('Notification' in window) {
        actualizarEstadoNotificaciones(Notification.permission === 'granted');
      }
    });

    // LÓGICA DE INSTALACIÓN PWA
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        document.getElementById('pwaModal').style.display = 'flex';
      }
    });

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS && !isStandalone) {
      setTimeout(() => {
        document.getElementById('pwaModal').style.display = 'flex';
        document.getElementById('btnInstallPWA').classList.add('d-none');
        document.getElementById('iosInstruction').classList.remove('d-none');
      }, 1500);
    }

    function instalarPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          cerrarModalPWA();
        });
      }
    }

    function cerrarModalPWA() {
      document.getElementById('pwaModal').style.display = 'none';
    }
  </script>
</body>
</html>
