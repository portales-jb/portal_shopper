<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portal Shopper Pro</title>

  <!-- ARCHIVOS DE CONFIGURACIÓN PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001f3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Shopper">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Estilos Modal & Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ========================================== -->
  <!--      SDK Y CONFIGURACIÓN DE ONESIGNAL      -->
  <!-- ========================================== -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ecd72043-8857-49fa-8faf-522848a63e35",
        serviceWorkerPath: "/portal_shopper/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/portal_shopper/" },
        slidedown: {
          enabled: true,
          autoPrompt: true
        }
      });

      // 1. Verificar estado inicial
      const isSubscribed = OneSignal.User.PushSubscription.optedIn;
      actualizarEstadoNotificaciones(isSubscribed);

      // 2. Escuchar cambios de estado
      OneSignal.User.PushSubscription.addEventListener("change", function(event) {
        if (event.current && event.current.optedIn) {
          actualizarEstadoNotificaciones(true);
        } else {
          actualizarEstadoNotificaciones(false);
        }
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #001f3f;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .app-frame {
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 50px;
      z-index: 1;
    }

    /* PANTALLA DE CARGA (SPINNER) */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: calc(100% - 50px);
      background-color: #001f3f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      color: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* BARRA INFERIOR DE ACTIVACIÓN PUSH */
    .notification-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background-color: #00152b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 9999;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn-bell-push {
      background: #F54927;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 73, 39, 0.4);
      transition: all 0.3s ease;
    }

    .btn-bell-push.subscribed {
      background: #198754;
      box-shadow: 0 4px 12px rgba(25, 135, 84, 0.4);
    }
    
    /* MODAL INSTALACIÓN PWA */
    .pwa-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 31, 63, 0.92);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: white;
      text-align: center;
    }
    .pwa-card {
      background: #ffffff;
      color: #001f3f;
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .btn-instalar {
      background: #F54927;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      padding: 14px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(245, 73, 39, 0.3);
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE CARGA -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-light mb-3" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <h6 class="fw-bold">Cargando Portal Shopper...</h6>
    <p class="small text-white-50 text-center px-4" id="txtXiaomiHelp" style="display: none;">
      ¿Tarda en cargar? <a href="#" onclick="recargarIframe()" class="text-warning text-decoration-underline">Toca aquí para reintentar</a>
    </p>
  </div>

  <!-- IFRAME CORREGIDO PARA EVITAR ERROR 403 Y BLOQUEOS DE GOOGLE -->
  <iframe 
    id="mainFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbwjkr1xUt0tKydNE6Gsj0fd9JEy_uxl52YkiwtjKxtwC54MOLptgkjVX6WzeDkJtv4a/exec" 
    allow="camera; microphone; geolocation; autoplay; fullscreen; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    onload="ocultarLoader()">
  </iframe>

  <!-- BARRA INFERIOR -->
  <div class="notification-bar">
    <span class="text-white small fw-bold">
      <i class="fa-solid fa-shield-halved text-warning me-1"></i> Portal Shopper Pro
    </span>
    <button id="btnPedirNotificaciones" class="btn-bell-push" onclick="solicitarPermisoNotificacion()">
      <i class="fa-solid fa-bell fa-bounce"></i> <span id="lblBtnNotif">Activar Push</span>
    </button>
  </div>

  <!-- POP-UP PARA INSTALACIÓN PWA -->
  <div id="pwaModal" class="pwa-overlay">
    <div class="pwa-card">
      <img src="icon-192.png" width="75" height="75" class="rounded-4 mb-3 shadow-sm" alt="Logo">
      <h5 class="fw-bold mb-2">Instala la App Oficial</h5>
      <p class="text-muted small mb-4">Instala <b>Portal Shopper</b> en tu pantalla de inicio para un acceso rápido y directo.</p>
      
      <button id="btnInstallPWA" class="btn-instalar mb-2" onclick="instalarPWA()">
        <i class="fa-solid fa-download me-2"></i> INSTALAR AHORA
      </button>

      <div id="iosInstruction" class="d-none alert alert-light border mt-2 small text-start">
        <i class="fa-solid fa-arrow-up-from-bracket text-primary"></i> Toca <b>Compartir</b> en Safari y selecciona <b>"Agregar a inicio"</b>.
      </div>

      <button class="btn btn-link text-muted btn-sm text-decoration-none mt-2" onclick="cerrarModalPWA()">Continuar en navegador</button>
    </div>
  </div>

  <script>
    // CONTROL DEL IFRAME Y PANTALLA DE CARGA (SOLUCIÓN XIAOMI/REDMI)
    const loader = document.getElementById('loadingOverlay');
    const iframe = document.getElementById('mainFrame');
    const txtHelp = document.getElementById('txtXiaomiHelp');

    function ocultarLoader() {
      if (loader) {
        loader.classList.add('hidden');
      }
    }

    // Si tarda más de 5 segundos (común en Redmi/Xiaomi), mostrar ayuda
    setTimeout(() => {
      if (!loader.classList.contains('hidden')) {
        txtHelp.style.display = 'block';
      }
    }, 5000);

    function recargarIframe() {
      if (iframe) {
        iframe.src = iframe.src;
      }
    }

    // NOTIFICACIONES
    function solicitarPermisoNotificacion() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          if (OneSignal.User.PushSubscription.optedIn) {
            alert("¡Las notificaciones ya están activadas en este dispositivo!");
            actualizarEstadoNotificaciones(true);
            return;
          }

          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
          
          setTimeout(() => {
            const isOptedIn = OneSignal.User.PushSubscription.optedIn;
            if (isOptedIn) {
              alert("¡Notificaciones activadas exitosamente!");
              actualizarEstadoNotificaciones(true);
            }
          }, 1000);
        } catch (e) {
          alert("Error de permiso: " + e.message);
        }
      });
    }

    function actualizarEstadoNotificaciones(concedido) {
      const btn = document.getElementById('btnPedirNotificaciones');
      const lbl = document.getElementById('lblBtnNotif');
      
      if (!btn || !lbl) return;

      if (concedido) {
        btn.classList.add('subscribed');
        lbl.textContent = 'Push Activas';
        btn.querySelector('i').className = 'fa-solid fa-check me-1';
      } else {
        btn.classList.remove('subscribed');
        lbl.textContent = 'Activar Push';
        btn.querySelector('i').className = 'fa-solid fa-bell fa-bounce me-1';
      }
    }

    // PWA INSTALL LOGIC
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        document.getElementById('pwaModal').style.display = 'flex';
      }
    });

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS && !isStandalone) {
      setTimeout(() => {
        document.getElementById('pwaModal').style.display = 'flex';
        document.getElementById('btnInstallPWA').classList.add('d-none');
        document.getElementById('iosInstruction').classList.remove('d-none');
      }, 1500);
    }

    function instalarPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          cerrarModalPWA();
        });
      }
    }

    function cerrarModalPWA() {
      document.getElementById('pwaModal').style.display = 'none';
    }
  </script>
</body>
</html>
