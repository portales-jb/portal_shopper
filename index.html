<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Shopper - Notificaciones</title>

    <!-- SDK de OneSignal v16 (Web Push) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ecd72043-8857-49fa-8faf-522848a63e35",
        });

        // Verificar el estado de la suscripción al cargar la página
        actualizarEstadoNotificaciones(OneSignal);

        // Escuchar si el usuario otorga el permiso en tiempo real
        OneSignal.Notifications.addEventListener('permissionChange', function(permission) {
          actualizarEstadoNotificaciones(OneSignal);
        });
      });

      function actualizarEstadoNotificaciones(OneSignal) {
        const statusText = document.getElementById('status-text');
        const btn = document.getElementById('btn-notif');
        const isEnabled = OneSignal.Notifications.permission;

        if (isEnabled) {
          if (btn) {
            btn.style.backgroundColor = '#28a745'; // Cambia el botón a verde
            btn.innerText = '✓ Notificaciones Activas';
            btn.disabled = true; // Deshabilita el botón porque ya está activo
            btn.style.cursor = 'default';
          }
          if (statusText) {
            statusText.innerText = 'Ya estás recibiendo alertas y actualizaciones en tiempo real.';
            statusText.style.color = '#28a745';
          }
        }
      }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            color: #1a1a1a;
        }

        p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: #ff441f; /* Color estilo Rappi */
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #e03816;
        }

        .btn:disabled {
            background-color: #28a745 !important;
            opacity: 1;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🔔</div>
        <h2>Portal Shopper</h2>
        <p>Activa las notificaciones push para recibir alertas de nuevos pedidos y actualizaciones importantes en tiempo real.</p>
        
        <button id="btn-notif" class="btn" onclick="solicitarPermiso()">Activar Notificaciones</button>
        
        <div id="status-text" class="status">Pulsa el botón para suscribirte</div>
    </div>

    <script>
        async function solicitarPermiso() {
            const statusText = document.getElementById('status-text');
            
            try {
                await OneSignalDeferred.push(async function(OneSignal) {
                    await OneSignal.Notifications.requestPermission();
                    actualizarEstadoNotificaciones(OneSignal);
                });
            } catch (error) {
                console.error("Error al activar notificaciones:", error);
                if (statusText) {
                    statusText.innerText = "Hubo un problema al solicitar el permiso.";
                }
            }
        }
    </script>

</body>
</html>
