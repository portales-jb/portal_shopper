<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portal Shopper Pro</title>

  <!-- CONFIGURACIÓN PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001f3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soy Shopper">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Estilos Modal & Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- OneSignal SDK para Notificaciones Web Push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        // 🚨 REEMPLAZA ESTO CON TU 'OneSignal App ID' (El código largo)
        appId: "ecd72043-8857-49fa-8faf-522848a63e35",
        safari_web_id: "web.onesignal.auto.TU_WEB_ID", // OneSignal genera esto automáticamente. Si no lo tienes, bórralo.
        notifyButton: {
          enable: true, // Habilita la campana flotante en la app
          size: 'medium', // 'small', 'medium', 'large'
          theme: 'default', // 'default', 'dark'
          position: 'bottom-right', // 'bottom-left' o 'bottom-right'
          prenotify: true, // Muestra un mensaje previo
          showCredit: false, // Oculta el crédito de OneSignal
          text: {
            'tip.state.unsubscribed': 'Suscribirse a notificaciones',
            'tip.state.subscribed': 'Estás suscrito a las notificaciones',
            'tip.state.blocked': 'Has bloqueado las notificaciones',
            'message.prenotify': 'Haz clic para suscribirte a las notificaciones de pedidos.',
            'message.action.subscribed': '¡Gracias por suscribirte!',
            'message.action.resubscribed': '¡Ya estás suscrito de nuevo!',
            'message.action.unsubscribed': 'No recibirás más notificaciones.',
            'dialog.main.title': 'Administrar Notificaciones',
            'dialog.main.button.subscribe': 'SUSCRIBIRSE',
            'dialog.main.button.unsubscribe': 'ANULAR SUSCRIPCIÓN',
            'dialog.blocked.title': 'Desbloquear Notificaciones',
            'dialog.blocked.message': 'Sigue estas instrucciones para permitir las notificaciones:'
          }
        },
        promptOptions: {
            slidedown: {
                autoPrompt: true, // Muestra el mensaje de suscripción automáticamente
                text: {
                    actionMessage: "Nos gustaría enviarte notificaciones sobre nuevos pedidos y actualizaciones.",
                    acceptButton: "Permitir",
                    cancelButton: "No, gracias"
                },
                delay: {
                    pageViews: 1, // Muestra después de 1 vista de página
                    timeDelay: 10 // Muestra después de 10 segundos
                }
            }
        }
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #001f3f;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    
    /* MODAL DE INSTALACIÓN SUGERIDA/FORZADA */
    .pwa-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 31, 63, 0.92);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: white;
      text-align: center;
    }
    .pwa-card {
      background: #ffffff;
      color: #001f3f;
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .btn-instalar {
      background: #F54927;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      padding: 14px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(245, 73, 39, 0.3);
    }
  </style>
</head>
<body>

  <!-- TU WEBAPP DE GOOGLE APPS SCRIPT DENTRO DEL IFRAME CON PERMISOS COMPLETOS -->
  <iframe 
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbwjkr1xUt0tKydNE6Gsj0fd9JEy_uxl52YkiwtjKxtwC54MOLptgkjVX6WzeDkJtv4a/exec" 
    allow="camera; microphone; geolocation; autoplay; fullscreen"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation">
  </iframe>

  <!-- POP-UP PARA CAPTURAR LA INSTALACIÓN EN MÓVILES -->
  <div id="pwaModal" class="pwa-overlay">
    <div class="pwa-card">
      <img src="icon-192.png" width="75" height="75" class="rounded-4 mb-3 shadow-sm" alt="Logo">
      <h5 class="fw-bold mb-2">Instala la App Oficial</h5>
      <p class="text-muted small mb-4">Instala <b>Portal Shopper</b> en tu pantalla de inicio para un acceso rápido y directo.</p>
      
      <!-- Botón Android / Chrome -->
      <button id="btnInstallPWA" class="btn-instalar mb-2" onclick="instalarPWA()">
        <i class="fa-solid fa-download me-2"></i> INSTALAR AHORA
      </button>

      <!-- Instrucción si el usuario usa iPhone / Safari -->
      <div id="iosInstruction" class="d-none alert alert-light border mt-2 small text-start">
        <i class="fa-solid fa-arrow-up-from-bracket text-primary"></i> Toca <b>Compartir</b> en Safari y selecciona <b>"Agregar a inicio"</b>.
      </div>

      <button class="btn btn-link text-muted btn-sm text-decoration-none mt-2" onclick="cerrarModalPWA()">Continuar en navegador</button>
    </div>
  </div>

  <script>
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // Detectar cuando Chrome/Android está listo para instalar
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        document.getElementById('pwaModal').style.display = 'flex';
      }
    });

    // Detectar si el dispositivo es iPhone / iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS && !isStandalone) {
      setTimeout(() => {
        document.getElementById('pwaModal').style.display = 'flex';
        document.getElementById('btnInstallPWA').classList.add('d-none');
        document.getElementById('iosInstruction').classList.remove('d-none');
      }, 1500);
    }

    // Acción del botón Instalar
    function instalarPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          cerrarModalPWA();
        });
      }
    }

    function cerrarModalPWA() {
      document.getElementById('pwaModal').style.display = 'none';
    }

    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
